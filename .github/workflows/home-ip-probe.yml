# READ-ONLY test (v2, 2026-11-10). Writes nothing to Supabase, needs no secrets.
# Question: can GitHub Actions take over the two Monday jobs that ran on the home server?
#   - Deezer catalogs: compares 14 artists' release counts seen from GitHub's runner with the counts
#     stored in raw.deezer_artist_albums on 2026-11-09 from a Philippine IP (allowed difference: 2).
#   - YouTube "most replayed": reads 25 real NDN videos with yt-dlp (12 are known to have a graph).
#     Datacenter IPs often get "Sign in to confirm you're not a bot".
# v1 (same day): Lola Amour 33 releases from a US runner = same as the PH IP; control video read OK.
# Run by hand (Actions > home-ip-probe > Run workflow) and read the log.
name: home-ip-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -U "yt-dlp[default,curl-cffi]"

      - name: Deezer from here vs the stored Philippine-IP counts
        run: |
          python - <<'PY'
          import json, time, urllib.request
          STORED = {16892: 15, 199364: 35, 453534: 24, 1294111: 97, 4045724: 22, 4300027: 23, 4457082: 27,
                    5890276: 24, 14063231: 33, 15139315: 25, 92863932: 36, 94331372: 17, 111884232: 27, 164137597: 26}
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": "ndn-portfolio-pipeline/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())
          try:
              print("runner country:", get("https://ipinfo.io/json").get("country"))
          except Exception as e:
              print("runner country: unknown", e)
          same = diff = err = 0
          for aid, stored in STORED.items():
              url, seen, bad = f"https://api.deezer.com/artist/{aid}/albums?limit=100", 0, None
              for _ in range(5):
                  time.sleep(0.2)
                  page = get(url)
                  if isinstance(page, dict) and page.get("error"):
                      bad = page["error"]
                      break
                  seen += len(page.get("data", []))
                  url = page.get("next")
                  if not url:
                      break
              if bad:
                  err += 1
                  print(aid, "error:", bad)
              elif abs(seen - stored) <= 2:
                  same += 1
                  print(aid, "stored", stored, "now", seen, "ok")
              else:
                  diff += 1
                  print(aid, "stored", stored, "now", seen, "DIFF")
          print(f"same {same}, different {diff}, errors {err} (of {len(STORED)})")
          print("PASS" if diff == 0 and err == 0 else "FAIL (catalog differs from the Philippine view: this job needs a PH IP)")
          PY

      - name: YouTube most-replayed from here (25 real NDN videos + 1 control)
        run: |
          python - <<'PY'
          import time, yt_dlp
          GRAPH = "_4ZQgl749pA _A8iJ5hrpkM _JFxEZFsMLw _k-8ta5SgKU _LW04eMEHBM _OFBRTFACUE _Rj57VZrx2k _vk-41j0tDk -4Lf2AXY0w8 -8Pu9dypdhw -FgKl2UvqsQ -fkFvlmPJpQ".split()
          OTHER = "AGcE1qfAzKk xCwyoyWech4 a4nl_zAfjLI L0KfA4SF4O4 -7HwKDuwHLs 5qJBosN1-8o 2iYqAwCVJ-o csdjbix7O70 9qsyEGzn8TA hF0ds5NEi9U yIk0uti1uB8 lbUdS7bZ_W4 PxP-dEbOQ54".split()
          ids = ["dQw4w9WgXcQ"] + GRAPH + OTHER
          ok = blocked = other = graphs = 0
          with yt_dlp.YoutubeDL({"quiet": True, "no_warnings": True, "skip_download": True}) as ydl:
              for vid in ids:
                  try:
                      info = ydl.extract_info(f"https://www.youtube.com/watch?v={vid}", download=False)
                      n = len(info.get("heatmap") or [])
                      ok += 1
                      graphs += 1 if (n and vid in GRAPH) else 0
                      print(vid, "read OK, graph points:", n, "(known graph)" if vid in GRAPH else "")
                  except Exception as e:
                      msg = str(e)
                      if "confirm you" in msg and "bot" in msg:
                          blocked += 1
                          print(vid, "BLOCKED (bot check)")
                      else:
                          other += 1
                          print(vid, "error:", msg[:120])
                  time.sleep(2)
          print(f"read OK {ok}, bot-blocked {blocked}, other errors {other}, known-graph videos with a graph {graphs}/{len(GRAPH)}")
          print("PASS" if blocked == 0 and graphs >= 9 and other <= 3 else "FAIL (YouTube blocks or throttles this IP: this job needs a home IP)")
          PY
